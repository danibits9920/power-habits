name: Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Analyze, Test & Release APK (arm64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version from pubspec.yaml
        id: version
        run: |
          RAW_VERSION=$(grep -E '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | tr -d '\r')
          SEMVER="${RAW_VERSION%%+*}"
          TAG="v${SEMVER}"
          echo "raw=${RAW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${SEMVER} (tag: ${TAG})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Check if GitHub Release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — skipping APK publication."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist yet — proceeding with release build."
          fi

      - name: Configure Android signing keystore (if secret is configured)
        if: steps.check_release.outputs.exists == 'false'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF
            echo "Configured release signing keystore."
          else
            echo "ANDROID_KEYSTORE_BASE64 secret not set; falling back to reproducible debug signing."
          fi

      - name: Build Android release APK (arm64)
        if: steps.check_release.outputs.exists == 'false'
        run: flutter build apk --release --target-platform android-arm64

      - name: Publish GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SEMVER: ${{ steps.version.outputs.semver }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          APK_ASSET="power-habits-v${SEMVER}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_ASSET"
          gh release create "$TAG" "$APK_ASSET" \
            --title "Power Habits ${TAG}" \
            --generate-notes
