name: power_habits
description: "Power Habits — App móvil personal local-first de hábitos, tareas, metas y logros."
publish_to: 'none'
version: 0.3.0+4

environment:
  sdk: ^3.13.0

dependencies:
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.11.1
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  timezone: ^0.11.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans.ttf
